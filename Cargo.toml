[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/dwv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["DezFix"]
repository = "https://github.com/DezFix/DwV"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
rfd = "0.17"
tokio-tungstenite = "0.30"
librqbit = "9"
open = "5"
sha2 = "0.10"
lazy_static = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
