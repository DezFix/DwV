<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DwV — Download Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg-primary: #eef0f4;
        --bg-secondary: #f6f7f9;
        --bg-tertiary: #e6e9ee;
        --bg-elevated: #ffffff;
        --bg-hover: #f4f6f9;
        --border-color: #e0e4ea;
        --border-light: #cdd3dc;
        --text-primary: #1c2028;
        --text-secondary: #59616e;
        --text-muted: #5c6673;
        --accent: #2d7dd2;
        --accent-hover: #1f66b8;
        --accent-soft: #e5f0fb;
        --accent-glow: rgba(45, 125, 210, 0.14);
        --success: #2ea043;
        --warning: #bf8700;
        --error: #cf222e;
        --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.06);
        --shadow-md: 0 4px 12px rgba(31, 35, 40, 0.1);
        --shadow-lg: 0 8px 24px rgba(31, 35, 40, 0.14);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --transition-fast: 140ms ease;
        --transition-normal: 250ms ease;
      }

      :root[data-theme='dark'] {
        --bg-primary: #14171d;
        --bg-secondary: #1b1f27;
        --bg-tertiary: #262b35;
        --bg-elevated: #1f242c;
        --bg-hover: #262b35;
        --border-color: #2c323d;
        --border-light: #3b424f;
        --text-primary: #e6e9ef;
        --text-secondary: #a8b0bd;
        --text-muted: #8f98a8;
        --accent: #4a9eff;
        --accent-hover: #6bb0ff;
        --accent-soft: rgba(74, 158, 255, 0.16);
        --accent-glow: rgba(74, 158, 255, 0.2);
        --success: #3fb950;
        --warning: #d29922;
        --error: #f85149;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      *::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-primary);
        color: var(--text-primary);
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
      }

      ::selection {
        background: rgba(59, 130, 246, 0.35);
      }

      /* Motion */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes rise-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes slide-in-left {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes pulse-bar {
        0% { background-position: 0 0; }
        100% { background-position: 28px 0; }
      }

      [hidden] {
        display: none !important;
      }

      :root[data-animations='off'] *,
      :root[data-animations='off'] *::before,
      :root[data-animations='off'] *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
