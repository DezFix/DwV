[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["DezFix"]
repository = "https://github.com/DezFix/DwV"

[workspace.dependencies]
slint = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
