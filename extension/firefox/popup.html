<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>DwV</title>
  <style>
    :root {
      --bg: #eef0f4;
      --bg-soft: #ffffff;
      --bg-tertiary: #e6e9ee;
      --border: #e0e4ea;
      --text: #1c2028;
      --muted: #8a929e;
      --accent: #2d7dd2;
      --accent-hover: #1f66b8;
      --accent-soft: #e5f0fb;
      --ok: #2ea043;
      --bad: #cf222e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d;
        --bg-soft: #1f242c;
        --bg-tertiary: #262b35;
        --border: #2c323d;
        --text: #e6e9ef;
        --muted: #6f7887;
        --accent: #4a9eff;
        --accent-hover: #6bb0ff;
        --accent-soft: rgba(74, 158, 255, 0.16);
        --ok: #3fb950;
        --bad: #f85149;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 440px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo { width: 21px; height: 21px; border-radius: 5px; display: block; flex-shrink: 0; }
    .title { font-weight: 600; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online { background: var(--ok); }
    .dot.offline { background: var(--bad); }

    section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    section:last-child { border-bottom: none; }

    .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
    }

    .switch-row span { font-size: 12.5px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 10px;
      transition: background 0.15s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }

    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      padding: 6px 10px;
      max-width: 100%;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover:not(:disabled) { background: var(--bg-tertiary); }
    button:disabled { opacity: 0.45; cursor: default; }

    button.small { padding: 3px 8px; font-size: 11.5px; }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      width: 100%;
      max-width: 100%;
    }

    .primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }

    .videos {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
      padding-right: 2px;
    }

    .video {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 9px;
      background: var(--bg-soft);
    }

    .video-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta { font-size: 11px; color: var(--muted); margin: 1px 0 7px; }

    .video-actions { display: flex; gap: 6px; }
    .video-actions button { padding: 4px 9px; font-size: 11.5px; }

    .video-status { font-size: 11px; color: var(--bad); margin-top: 5px; }
    .video-status:empty { display: none; }

    .empty {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 10px 0;
    }

    .notice {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 7px;
      min-height: 16px;
    }

    .notice.bad { color: var(--bad); }
    .notice.good { color: var(--ok); }

    .preview {
      display: flex;
      gap: 10px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-soft);
    }

    .preview-thumb {
      position: relative;
      width: 116px;
      height: 65px;
      border-radius: 6px;
      overflow: hidden;
      background: linear-gradient(135deg, #2b3440, #1b222c);
      flex-shrink: 0;
    }

    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .preview-thumb.has-img img { display: block; }
    .preview-thumb .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
      pointer-events: none;
    }

    .preview-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .preview-title {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-meta { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-btn { align-self: flex-start; margin-top: auto; padding: 4px 9px; font-size: 11px; border-radius: 5px; }
    .videos { margin-top: 9px; }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="icon-48.png" alt="DwV">
    <span class="title">DwV</span>
    <span class="status"><span class="dot" id="dot"></span><span id="status">проверка…</span></span>
  </header>

  <section>
    <div class="switch-row">
      <div>
        <span>Плагин включён</span>
        <div class="hint">Автоматический перехват и передача</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-row">
      <div>
        <span>Перехватывать файлы</span>
        <div class="hint">Вложения и ссылки на файлы</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="capture-files" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-row">
      <div>
        <span>Перехватывать видео</span>
        <div class="hint">Видео на странице и в сети</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="capture-video" checked>
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section>
    <div class="section-head">
      <div class="label">Видео на странице</div>
      <button id="refresh" class="small" type="button">Обновить</button>
    </div>
    <div class="preview" id="page-preview">
      <div class="preview-thumb" id="preview-thumb">
        <img id="preview-img" alt="">
        <span class="play">▶</span>
      </div>
      <div class="preview-info">
        <div class="preview-title" id="preview-title">Видео на странице</div>
        <div class="preview-meta" id="preview-meta"></div>
        <button id="preview-download" class="primary preview-btn" type="button">Скачать</button>
      </div>
    </div>
    <div class="videos" id="videos">
    </div>
    <div class="notice" id="page-notice" role="status" aria-live="polite"></div>
  </section>

  <section>
    <button id="open-app" class="primary" type="button">Открыть DwV</button>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
